services:
  taskapp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:4000}"
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: "${NODE_ENV:-production}"
      APP_PORT: "${APP_PORT:-4000}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:3000}"
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:4000}"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: "${DB_USER:?Set DB_USER in the .env file}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in the .env file}"
      DB_NAME: "${DB_NAME:?Set DB_NAME in the .env file}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in the .env file}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-7d}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      NOTIFICATION_POLL_CRON: "${NOTIFICATION_POLL_CRON:-*/1 * * * *}"
    ports:
      - "3000:3000"
      - "${APP_PORT:-4000}:${APP_PORT:-4000}"

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_NAME:?Set DB_NAME in the .env file}"
      MYSQL_USER: "${DB_USER:?Set DB_USER in the .env file}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in the .env file}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in the .env file}"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root --password="$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data: